map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

limit_req_zone $binary_remote_addr zone=diagnostic_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=diagnostic_admin:10m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name maxi.kirtarget.ru;
    return 301 https://maxi.kirtarget.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name maxi.kirtarget.ru;

    ssl_certificate /etc/letsencrypt/live/maxi.kirtarget.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/maxi.kirtarget.ru/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 2m;
    limit_req_status 429;
    error_page 429 = @diagnostic_rate_limited;

    location @diagnostic_rate_limited {
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Retry-After "1" always;
        return 429;
    }

    location = /healthz {
        limit_req zone=diagnostic_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:18082/healthz;
        proxy_http_version 1.1;
        include proxy_params;
    }

    location ^~ /api/admin/ {
        limit_req zone=diagnostic_admin burst=30 nodelay;
        proxy_pass http://127.0.0.1:18082;
        proxy_http_version 1.1;
        include proxy_params;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location ^~ /api/ {
        limit_req zone=diagnostic_api burst=200 nodelay;
        proxy_pass http://127.0.0.1:18082;
        proxy_http_version 1.1;
        include proxy_params;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location ^~ /admin/static/ {
        proxy_pass http://127.0.0.1:18082;
        proxy_http_version 1.1;
        include proxy_params;
        proxy_read_timeout 30s;
    }

    location ^~ /admin/ {
        limit_req zone=diagnostic_admin burst=30 nodelay;
        proxy_pass http://127.0.0.1:18082;
        proxy_http_version 1.1;
        include proxy_params;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:13002;
        proxy_http_version 1.1;
        include proxy_params;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
