name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  release:
    name: Build and push images
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/kirtarget/maxi_diagnostics/backend:${{ github.sha }}
            ghcr.io/kirtarget/maxi_diagnostics/backend:main
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: miniapp/Dockerfile
          push: true
          tags: |
            ghcr.io/kirtarget/maxi_diagnostics/miniapp:${{ github.sha }}
            ghcr.io/kirtarget/maxi_diagnostics/miniapp:main
          cache-from: type=gha,scope=miniapp
          cache-to: type=gha,mode=max,scope=miniapp
